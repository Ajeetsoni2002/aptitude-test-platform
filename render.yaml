# Render Blueprint — sirf backend (free tier)
# Frontend Firebase Hosting par hai — DEPLOYMENT.md dekho.
# Render Dashboard → New → Blueprint → is repo ko select karo.
# `sync: false` wale variables Render pehli baar deploy pe aapse puchega.

services:
  - type: web
    name: aptitude-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # e.g. https://my-project.web.app,https://my-project.firebaseapp.com
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
