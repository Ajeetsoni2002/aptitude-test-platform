name: Keep Render Awake

# Render free tier 15 min idle ke baad backend ko sula deta hai (phir pehli request ~50s leti hai).
# Ye workflow har ~5 min /health ping karta hai taaki server jaagta rahe.
# Note: GitHub scheduled runs kabhi-kabhi kuch minute late chalte hain, aur repo me 60 din tak
# koi commit na ho to GitHub scheduled workflows band kar deta hai (Actions tab se dobara enable karo).
on:
  schedule:
    - cron: "3-59/5 * * * *" # har 5 min (:00 se bacha ke — us waqt GitHub par load zyada hota hai)
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        env:
          HEALTH_URL: https://aptitude-test-platform-i74k.onrender.com/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$HEALTH_URL" || true)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Backend health check failed after 3 attempts"
          exit 1
